# ╔══════════════════════════════════════════════════════════════════╗
# ║                        PROFILE  ·  menu (9x6)                      ║
# ╚══════════════════════════════════════════════════════════════════╝

title: "<gradient:#a855f7:#22d3ee><bold>✦ Cosmic Profile</bold></gradient>"
open-sound: "block.amethyst_block.chime 1 1.2"
click-sound: "ui.button.click 0.4 1.6"

perks:
  speed:
    slot: 21
    active:
      material: SUGAR
      glow: true
      name: "<#86efac><bold>Speed I</bold> <#71717a>· active"
      lore:
        - "<#a1a1aa>Permanent while you have"
        - "<#fde68a>{required}+ brightness</#fde68a>."
    inactive:
      material: GUNPOWDER
      name: "<#71717a><bold>Speed I</bold> · locked"
      lore:
        - "<#a1a1aa>Reach <#fde68a>{required} brightness</#fde68a> to unlock."
  dash:
    slot: 23
    active:
      material: WIND_CHARGE
      glow: true
      name: "<#86efac><bold>Dash</bold> <#71717a>· active"
      lore:
        - "<#a1a1aa>Sneak + F to dash <#e4e4e7>{distance} blocks</#e4e4e7>."
        - "<#71717a>Status: <#e4e4e7>{cooldown}"
    inactive:
      material: GRAY_DYE
      name: "<#71717a><bold>Dash</bold> · locked"
      lore:
        - "<#a1a1aa>Reach <#fde68a>{required} brightness</#fde68a> to unlock."

owned-stars:
  slots: [29, 30, 31, 32, 33]
  name: "{star}"
  lore:
    - "{abilities}"
    - ""
    - "<#fde68a>» Click to open the skill tree"
  ability-line:
    unlocked: "<#86efac>✔ <#e4e4e7>{name}"
    locked: "<#52525b>✖ {name}"
  empty:
    material: GRAY_STAINED_GLASS_PANE
    name: "<#52525b>Empty star socket"
    lore:
      - "<#71717a>Buy stars at the Galactic Merchant."

items:
  background:
    slots: ["0-53"]
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  frame:
    slots: [0, 2, 6, 8, 45, 47, 51, 53]
    material: PURPLE_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  frame-accent:
    slots: [1, 3, 5, 7, 46, 52]
    material: CYAN_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  head:
    slot: 4
    material: PLAYER_HEAD
    skull-owner: "{player}"
    name: "<gradient:#a855f7:#22d3ee><bold>{player}</bold></gradient>"
    lore:
      - "<#71717a>Kills    <#e4e4e7>{kills}"
      - "<#71717a>Deaths   <#e4e4e7>{deaths}"
      - "<#71717a>Stars bought  <#e4e4e7>{stars_bought}"
      - "<#71717a>Abilities cast  <#e4e4e7>{abilities_cast}"
  brightness:
    slot: 13
    material: GLOWSTONE_DUST
    glow: true
    name: "<#fde68a><bold>Brightness  {brightness_color}{brightness}<#52525b>/{brightness_max}"
    lore:
      - "{brightness_bar}"
      - ""
      - "<#86efac>+1 <#a1a1aa>for each player you kill"
      - "<#ff5c7a>-1 <#a1a1aa>when a player kills you"
      - "<#ff5c7a>☠ <#a1a1aa>death ban at <#ff5c7a>{ban_threshold}"
  stars-label:
    slot: 22
    material: NETHER_STAR
    name: "<#c084fc><bold>Your Stars  <#e4e4e7>{stars_owned}"
    lore:
      - "<#71717a>Discovered (rebuy without stock): <#e4e4e7>{stars_discovered}"
  merchant:
    slot: 49
    material: ENDER_EYE
    name: "<gradient:#a855f7:#22d3ee><bold>Galactic Merchant</bold></gradient>"
    lore:
      - "<#a1a1aa>Browse every star."
      - ""
      - "<#fde68a>» Click to open"
    actions: ["open:merchant"]
  close:
    slot: 53
    material: BARRIER
    name: "<#ff5c7a><bold>Close"
    actions: ["close"]
