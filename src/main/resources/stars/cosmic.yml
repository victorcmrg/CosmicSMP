# ╔══════════════════════════════════════════════════════════════════╗
# ║                           COSMIC STAR                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# See sonic.yml for the documentation of every field.

id: cosmic
enabled: true
order: 4
display-name: "<gradient:#a855f7:#c084fc:#f0abfc><bold>Cosmic Star</bold></gradient>"
color: "#c084fc"
price: 6
stock: 5
merchant-slot: 22
model: ""
description:
  - "<#a1a1aa>The heart of the night sky itself."
  - "<#a1a1aa>Reality bends around its bearer."

item:
  material: NETHER_STAR
  name: "{star_name}"
  glow: true
  lore:
    - "{description}"
    - ""
    - "{abilities}"
    - ""
    - "<#52525b>Bound to {owner}"
    - "{controls}"

icon:
  material: NETHER_STAR

passive:
  ability: night_resistance
  name: "<#c084fc>Nightborn"
  cost: 2
  description:
    - "<#a1a1aa>At night you gain Resistance II."
  icon:
    material: CLOCK
  settings:
    amplifier: 1               # Resistance II
    night-start: 13000
    night-end: 23000

primaries:
  1:
    ability: comet_ride
    name: "<#c084fc>Ride a Comet"
    cost: 3
    cooldown: 40
    description:
      - "<#a1a1aa>Ride a burning comet and fly for"
      - "<#a1a1aa>8 seconds. It crashes when it ends."
    icon:
      material: FIRE_CHARGE
    settings:
      duration-seconds: 8
      speed: 1.0
      comet-scale: 1.4
      comet-item:              # use itemsadder:cosmic:comet for the 3D model
        material: MAGMA_BLOCK
      impact-damage: 4.0
      impact-radius: 3
      sounds:
        cast: "entity.blaze.shoot 1.2 0.7"
        loop: "entity.blaze.burn 0.8 0.6"
        impact: "entity.firework_rocket.large_blast 1.2 0.8"
      particles:
        fire: {type: FLAME, count: 4, offset: 0.25, speed: 0.02}
        stardust: {type: DUST, color: "#c084fc", size: 1.3, count: 2, offset: 0.3}
  2:
    ability: mirror_clone
    name: "<#c084fc>Mirror Clone"
    cost: 5
    cooldown: 300
    description:
      - "<#a1a1aa>Copy a player's skin, name and armour"
      - "<#a1a1aa>trims for 4 minutes."
    icon:
      material: ARMOR_STAND
    settings:
      range: 30
      duration-seconds: 240
      copy-armor: true
  3:
    ability: astral_phase
    name: "<#c084fc>Astral Phase"
    cost: 5
    cooldown: 60
    description:
      - "<#a1a1aa>Knock a player's spirit out of their"
      - "<#a1a1aa>body until they walk back into it."
      - "<#a1a1aa>Hits on the empty body hurt them."
    icon:
      material: PHANTOM_MEMBRANE
    settings:
      range: 20
      players-only: false        # mobs become soulless (frozen) instead
      max-duration-seconds: 15   # the spirit is pulled back after this
      push-distance: 3.0         # how far the spirit is knocked out of the body
      leash-radius: 10           # the spirit can't go further than this from its body
      return-radius: 1.4         # walk this close to the body (or click it) to return
      body-damage-multiplier: 1.5  # hits on the empty body are stored x1.5 and applied on return
      body-label: "<#c4b5fd>Empty Vessel <#ff5c7a>❤ {health}"
      mob-duration-seconds: 6
      sounds:
        cast: "entity.vex.charge 1.2 0.6"
        return: "block.respawn_anchor.charge 1.0 1.4"
      particles:
        spirit: {type: WHITE_ASH, count: 6, offset: 0.3, speed: 0.01}
        tether: {type: DUST, color: "#c4b5fd", size: 0.8}
