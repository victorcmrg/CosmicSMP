# ║                            ELDER STAR                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# See sonic.yml for the documentation of every field.

id: elder
enabled: true
order: 3
display-name: "<gradient:#14b8a6:#5eead4><bold>Elder Star</bold></gradient>"
color: "#5eead4"
price: 6
stock: 5
merchant-slot: 29
model: ""
description:
  - "<#a1a1aa>The ancient eye of the ocean temples,"
  - "<#a1a1aa>crystallised into starlight."

item:
  material: PRISMARINE_CRYSTALS
  name: "{star_name}"
  glow: true
  lore:
    - "{description}"
    - ""
    - "{abilities}"
    - ""
    - "<#52525b>Bound to {owner}"
    - "{controls}"

icon:
  material: PRISMARINE_CRYSTALS

passive:
  ability: fatigue_strike
  name: "<#5eead4>Elder's Curse"
  cost: 2
  description:
    - "<#a1a1aa>Your hits inflict Mining Fatigue"
    - "<#a1a1aa>for 5 seconds."
  icon:
    material: PRISMARINE_SHARD
  settings:
    duration-seconds: 5
    amplifier: 2               # Mining Fatigue III, like the Elder Guardian

primaries:
  1:
    ability: elder_laser
    name: "<#5eead4>Guardian Laser"
    cost: 3
    cooldown: 10
    description:
      - "<#a1a1aa>Charge and fire a laser that deals"
      - "<#a1a1aa>3 hearts to the first enemy it hits."
    icon:
      material: END_ROD
    settings:
      charge-ticks: 8
      range: 26
      ray-size: 0.45
      damage: 6.0              # 3 hearts
      glow-seconds: 2
      sounds:
        charge: "entity.guardian.attack 1.2 1.6"
        fire: "block.beacon.power_select 1.2 1.9"
        hit: "entity.elder_guardian.hurt 1.0 1.6"
      particles:
        beam: {type: DUST_COLOR_TRANSITION, color: "#5eead4", to-color: "#fde047", size: 1.3}
        spark: ELECTRIC_SPARK
  2:
    ability: tidal_wave
    name: "<#5eead4>Tidal Wave"
    cost: 5
    cooldown: 25
    description:
      - "<#a1a1aa>A wave rushes out from you, launching"
      - "<#a1a1aa>everyone into the air (6 hearts)."
    icon:
      material: HEART_OF_THE_SEA
    settings:
      radius: 9
      speed: 0.6               # blocks per tick
      height: 3
      damage: 12.0             # 6 hearts
      launch: 1.25
      outward: 0.5
      sounds:
        cast: "item.trident.riptide_3 1.2 0.8"
      particles:
        water: {type: DUST, color: "#0ea5e9", size: 1.6}
        crest: {type: DUST, color: "#a5f3fc", size: 1.1}
        foam: {type: SPLASH, count: 2, offset: 0.15, speed: 0.1}
  3:
    ability: force_field
    name: "<#5eead4>Elder Force Field"
    cost: 3
    cooldown: 45
    description:
      - "<#a1a1aa>A 5x5 bubble for 10 seconds. Anyone"
      - "<#a1a1aa>trying to enter bounces off."
    icon:
      material: CONDUIT
    settings:
      duration-seconds: 10
      radius: 2.5              # 5x5 blocks
      follow-caster: true
      push: 0.9
      lift: 0.35
      reflect-projectiles: true
      points: 64
      sounds:
        start: "block.beacon.activate 1.2 1.4"
        loop: "block.beacon.ambient 0.9 1.6"
        bounce: "block.amethyst_block.hit 1.2 1.4"
        end: "block.beacon.deactivate 1.0 1.4"
      particles:
        shell: {type: DUST, color: "#67e8f9", size: 0.9}
        sparkle: END_ROD
